name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: FastShare-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FastShare.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FastShare.apk --title "FastShare APK" --notes "Latest build. Download FastShare.apk on your Android phone and open it to install."
