plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fastshare.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fastshare.app'
        minSdk 30
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    signingConfigs {
        // The release key lives outside the repo. CI passes it in through these variables (from the
        // FASTSHARE_SIGNING_KEY secret). With the same key every build installs as an update over the
        // last one. Without them (local builds, forks) the build falls back to the debug key.
        release {
            def ksPath = System.getenv('FASTSHARE_KEYSTORE')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('FASTSHARE_KEYSTORE_PASSWORD')
                keyAlias 'fastshare'
                keyPassword System.getenv('FASTSHARE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('FASTSHARE_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '3g'
                // file names with accents need a UTF-8 locale even where the machine has none set
                environment 'LC_ALL', 'C.UTF-8'
                // Robolectric keeps a lot of resources alive across the many UI tests
                forkEvery = 0
                // Optional: point at a folder holding the Robolectric android-all jar to run offline.
                def roboDir = System.getenv('ROBOLECTRIC_DIR')
                if (roboDir) {
                    systemProperty 'robolectric.offline', 'true'
                    systemProperty 'robolectric.dependency.dir', roboDir
                }
                systemProperty 'shots.dir', "${buildDir}/shots"
            }
        }
    }

    packaging {
        resources {
            // the protocol libraries ship overlapping metadata files; none of them is needed at run time
            excludes += ['META-INF/versions/**/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST',
                         'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'org.apache.commons:commons-compress:1.26.2'   // 7z, tar, gz, bz2, xz
    implementation 'org.tukaani:xz:1.9'
    implementation 'com.github.junrar:junrar:7.5.5'                // rar
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    implementation 'commons-net:commons-net:3.11.1'                // ftp, ftps
    implementation 'com.github.mwiede:jsch:0.2.20'                 // sftp
    implementation 'com.hierynomus:smbj:0.13.0'                    // smb2/3 (windows shares, nas)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'            // webdav

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.apache.ftpserver:ftpserver-core:1.2.0'
}
