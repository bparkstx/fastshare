name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Install real test servers (WebDAV, SMB, SFTP) and the WebDAV compliance suite
        # The network-location tests talk to real servers on localhost. Without these they are skipped.
        run: |
          python3 -m venv "$RUNNER_TEMP/pyenv"
          "$RUNNER_TEMP/pyenv/bin/pip" install --quiet wsgidav cheroot impacket asyncssh
          echo "FB_PYENV_BIN=$RUNNER_TEMP/pyenv/bin" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends litmus
      - name: Run tests (server, file operations, network protocols and the app's screens)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Load signing key
        # FASTSHARE_SIGNING_KEY is "<password>:<base64 keystore>". Without it the APK is signed with
        # a throwaway debug key and has to be uninstalled before the next update.
        env:
          SIGNING_KEY: ${{ secrets.FASTSHARE_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            PASSWORD=$(echo "$SIGNING_KEY" | cut -d: -f1)
            echo "::add-mask::$PASSWORD"   # mask it before it can show up in any later step's log
            echo "$SIGNING_KEY" | cut -d: -f2- | base64 -d > "$RUNNER_TEMP/fastshare.p12"
            echo "FASTSHARE_KEYSTORE=$RUNNER_TEMP/fastshare.p12" >> "$GITHUB_ENV"
            echo "FASTSHARE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the FileBandit key"
          else
            echo "::warning::No FASTSHARE_SIGNING_KEY secret, signing with a temporary debug key"
          fi
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Show which key signed the APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "DN|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: FileBandit-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-previews
          path: app/build/shots/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
      - name: Publish APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FileBandit.apk
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest FileBandit.apk --target "$GITHUB_SHA" --title "FileBandit APK" \
              --notes "Latest build. Download FileBandit.apk on your Android phone and open it to install."
          else
            gh release delete preview --yes --cleanup-tag || true
            gh release create preview FileBandit.apk --target "$GITHUB_SHA" --prerelease \
              --title "FileBandit preview ($GITHUB_REF_NAME)" \
              --notes "Test build from branch $GITHUB_REF_NAME. Not the main release."
          fi
